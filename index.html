<!doctype html>
<html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misi Litera — Fasa Penutup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#101728;color:white;font-family:system-ui,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}.app{width:min(100vw,1600px);position:relative}.stage{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;background:#201b27;border-radius:14px;box-shadow:0 12px 45px #0008}.stage img{width:100%;height:100%;object-fit:fill;display:block;animation:sceneIn .75s ease-out both,sceneFloat 10s ease-in-out 1s infinite alternate}@keyframes sceneIn{from{opacity:0;filter:brightness(.6);transform:scale(1.04)}to{opacity:1;filter:brightness(1);transform:scale(1)}}@keyframes sceneFloat{to{transform:scale(1.012)}}.hit{position:absolute;cursor:pointer;border:0;background:transparent;border-radius:30px;z-index:7;touch-action:manipulation}.hit:hover{box-shadow:inset 0 0 0 3px #ffdd6688}.hit:focus-visible{outline:4px solid #fff;outline-offset:-5px;background:#fff2}.ctl{position:absolute;right:1%;top:1%;display:flex;gap:7px;z-index:9}.ctl button,.action{background:linear-gradient(#238b66,#05623d);border:2px solid #e5b84e;color:white;border-radius:30px;font-weight:800;padding:10px 16px;cursor:pointer;text-shadow:0 2px #143}.ctl button{padding:8px 12px;background:#40301e}.home{position:absolute;left:1.4%;top:2%;z-index:9;background:linear-gradient(#ffd45b,#e89011);border:3px solid #fff2b5;color:#4a240b;font-weight:900;border-radius:15px;padding:clamp(6px,1vw,14px);font-size:clamp(12px,1.3vw,19px);box-shadow:0 4px 12px #0007;cursor:pointer}.home:hover{filter:brightness(1.15)}.fx{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}.spark{position:absolute;font-size:clamp(13px,2.2vw,30px);animation:spark 2.4s ease-in-out infinite;opacity:0}@keyframes spark{0%,100%{opacity:0;transform:translateY(9px) scale(.6)}45%{opacity:.85;transform:translateY(-8px) scale(1.1)}}@media(prefers-reduced-motion:reduce){.stage img,.spark{animation:none!important}}.modal{position:absolute;inset:0;background:#061224d9;display:none;align-items:center;justify-content:center;padding:3%;z-index:10}.modal.show{display:flex}.panel{background:#fff6df;color:#202338;border:6px solid #ad7731;border-radius:22px;max-height:100%;overflow:auto;padding:clamp(12px,2.5vw,32px);width:min(95%,780px);text-align:center;box-shadow:0 12px 35px #0009}.panel h2{margin:0 0 8px;font-size:clamp(20px,3vw,35px)}.panel p{font-size:clamp(14px,1.6vw,21px)}.questions{display:grid;gap:12px;text-align:left}.question{border:2px solid #c4a56b;padding:12px;border-radius:12px}.question p{margin:0 0 9px;font-weight:700}.choices{display:flex;gap:7px;flex-wrap:wrap}.choices button{font-size:clamp(12px,1.4vw,17px);background:white;border:2px solid #c2a66d;border-radius:10px;padding:8px;cursor:pointer}.choices button.selected{background:#d8f4df;border-color:#13824b;box-shadow:inset 0 0 0 1px #13824b}.actions{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.action.secondary{background:#735637}.certificate{border:8px double #c79a39;padding:20px;background:#fffdf6;box-shadow:inset 0 0 22px #efc86b66}.certificate .cert-title{font-size:clamp(27px,4.2vw,49px);color:#7e3d0c;line-height:1.12;text-shadow:0 3px 0 #ffde7a,0 5px 9px #9c671f70;letter-spacing:.4px;animation:pop .7s ease-out both}.certificate .cert-stars{font-size:clamp(35px,6vw,70px);letter-spacing:.08em;filter:drop-shadow(0 0 9px #ffcc30);animation:pop .9s .1s ease-out both}@keyframes pop{0%{transform:scale(.78);opacity:.3}75%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}.certificate .cert-poppins{font-family:"Poppins",Arial,sans-serif}.certificate input{font-style:italic;width:min(100%,350px);font-size:22px;text-align:center;border:0;border-bottom:2px solid #a88441;background:transparent;padding:10px}.hint{font-size:12px;color:#5a5144;font-style:italic}@media(max-width:700px){.ctl button{font-size:11px;padding:6px 9px}.panel{border-width:3px}.stage{border-radius:0}.home{font-size:12px}}@media print{body{background:white}.app,.stage,.modal{position:static;display:block!important;box-shadow:none}.stage img,.hit,.home,.ctl,.actions,.hint,.fx{display:none!important}.modal{background:white;padding:0}.panel{border:0;max-height:none}.certificate{min-height:85vh;padding:7vh 5vw}.certificate input{font-size:32px}}
</style></head><body><main class="app"><div class="stage" id="stage"><img id="bg" src="slaid_23.webp" alt="Babak permainan detektif"><div class="ctl"><button id="music" title="Hidup atau matikan muzik">♫ Muzik: Mati</button></div><button id="home" class="home" title="Kembali ke permulaan fasa penutup" style="display:none">⌂ HOME</button><button class="hit" id="hotspot" aria-label="Teruskan ke babak seterusnya"></button><div class="fx" id="fx" aria-hidden="true"></div><section class="modal" id="modal" aria-live="polite"><div class="panel" id="panel"></div></section></div></main>
<audio id="profAudio" preload="auto" src="Tahniah, Detektif Cilik.m4a"></audio>
<script>
const slides={23:{title:'Jejak Memori Tersembunyi',hit:[.68,.80,.31,.18]},24:{title:'Mesej Rahsia Profesor',hit:[.65,.79,.34,.20]},25:{title:'Fail Misteri Ditemukan',hit:[.65,.80,.34,.19]},26:{title:'Rahsia di Sebalik Pintu',hit:[.71,.81,.28,.17]},27:{title:'Misi Berjaya',hit:[.64,.80,.34,.19]},28:{title:'Koleksi Bukti Detektif',hit:[.67,.81,.32,.18]},29:{title:'Refleksi Detektif Cilik',hit:[.69,.80,.30,.19]},30:{title:'Anugerah Detektif Bahasa',hit:[.69,.80,.30,.19]},31:{title:'Tamat Penyiasatan',hit:[.68,.81,.30,.18]}};
let slide=23,ctx=null,musicTimer=null,playing=false;const bg=document.getElementById('bg'),spot=document.getElementById('hotspot'),modal=document.getElementById('modal'),panel=document.getElementById('panel'),profAudio=document.getElementById('profAudio'),home=document.getElementById('home');
function stopProfessor(){profAudio.pause();profAudio.currentTime=0}function playProfessor(){stopProfessor();profAudio.volume=1;const p=profAudio.play();if(p&&p.catch)p.catch(()=>{ /* Pelayar mungkin memerlukan interaksi pengguna sebelum memainkan audio */ });}
function go(n){const previous=slide;slide=Math.max(23,Math.min(31,n));if(previous===24||slide!==24)stopProfessor();bg.style.animation='none';void bg.offsetWidth;bg.style.animation='';bg.src='slaid_'+slide+'.webp';bg.alt=slides[slide].title;const h=slides[slide].hit;Object.assign(spot.style,{left:(h[0]*100)+'%',top:(h[1]*100)+'%',width:(h[2]*100)+'%',height:(h[3]*100)+'%'});spot.setAttribute('aria-label',slide===29?'Buka refleksi':slide===30?'Buka sijil':'Ke babak seterusnya');spot.style.display='block';spot.setAttribute('aria-label',slide===31?'MENU UTAMA':slide===29?'Buka refleksi':slide===30?'Buka sijil':'Ke babak seterusnya');home.style.display=(slide===23||slide===31)?'none':'block';modal.classList.remove('show');renderEffects();if(slide===24)playProfessor()}
function renderEffects(){const fx=document.getElementById('fx');fx.innerHTML='';if([24,25,27,28,30,31].includes(slide)){[[58,36],[75,41],[62,65],[90,58],[42,21]].forEach(([x,y],i)=>{const e=document.createElement('span');e.className='spark';e.textContent='✦';e.style.left=x+'%';e.style.top=y+'%';e.style.animationDelay=i*.38+'s';fx.appendChild(e)})}}
function next(){if(slide===29){reflection();return}if(slide===30){certificate();return}if(slide===31){go(23);return}go(slide+1)}spot.onclick=next;home.onclick=()=>go(23);
function openPanel(html){panel.innerHTML=html;modal.classList.add('show')}
let answers={};const qs=[{q:'Adakah kamu seronok membaca cerita misteri?',a:['😊 Ya','😐 Biasa','🙁 Tidak']},{q:'Adakah kamu berjaya mencari makna perkataan menggunakan kamus digital?',a:['😊 Ya','😐 Dengan bantuan','🙁 Belum']},{q:'Adakah kamu mahu menyertai misi detektif yang lain?',a:['😊 Ya','😐 Mungkin','🙁 Tidak']}];
function reflection(){openPanel('<h2>🔎 Refleksi Detektif Cilik</h2><p>Pilih satu jawapan bagi setiap soalan.</p><div class="questions">'+qs.map((q,i)=>'<div class="question"><p>'+(i+1)+'. '+q.q+'</p><div class="choices">'+q.a.map((a,j)=>'<button type="button" data-i="'+i+'" data-j="'+j+'" class="'+(answers[i]===j?'selected':'')+'">'+a+'</button>').join('')+'</div></div>').join('')+'</div><div class="actions"><button class="action secondary" id="close">Kembali</button><button class="action" id="finish">SELESAI →</button></div>');panel.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{answers[+b.dataset.i]=+b.dataset.j;panel.querySelectorAll('[data-i="'+b.dataset.i+'"]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('close').onclick=()=>modal.classList.remove('show');document.getElementById('finish').onclick=()=>{if(Object.keys(answers).length<3){alert('Sila pilih jawapan bagi ketiga-tiga soalan.');return}go(30)}}
function certificate(){openPanel('<div class="certificate"><h2 class="cert-title">🏅 SIJIL DETEKTIF LITERA</h2><p class="cert-poppins">Dengan bangganya dianugerahkan kepada</p><input id="student" maxlength="65" placeholder="Nama murid" aria-label="Nama murid"><p class="cert-poppins">atas kejayaan menyelesaikan</p><h2 class="cert-poppins">Misi Litera: Rahsia di Sebalik Pintu!</h2><p><strong>GELARAN: DETEKTIF BAHASA CEMERLANG</strong></p><div class="cert-stars">⭐ ⭐ ⭐</div></div><div class="actions"><button class="action secondary" id="close">Kembali</button><button class="action" id="print">Cetak Sijil</button><button class="action" id="continue">TERUSKAN →</button></div><p class="hint"><em>Isikan nama murid sebelum mencetak.</em></p>');document.getElementById('close').onclick=()=>modal.classList.remove('show');document.getElementById('print').onclick=()=>window.print();document.getElementById('continue').onclick=()=>go(31)}
// Muzik ceria dan bertenaga dijana menggunakan Web Audio API tanpa fail mp3 tambahan.
function tone(freq,duration,when,volume=.025,type='triangle'){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(.0001,when);g.gain.linearRampToValueAtTime(volume,when+.012);g.gain.exponentialRampToValueAtTime(.0001,when+duration);o.connect(g).connect(ctx.destination);o.start(when);o.stop(when+duration+.02)}
function percussion(when,kind){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=kind==='kick'?'sine':'square';o.frequency.setValueAtTime(kind==='kick'?135:kind==='snare'?190:620,when);if(kind==='kick')o.frequency.exponentialRampToValueAtTime(48,when+.12);g.gain.setValueAtTime(kind==='hat'?.007:.018,when);g.gain.exponentialRampToValueAtTime(.0001,when+(kind==='kick'?.16:.045));o.connect(g).connect(ctx.destination);o.start(when);o.stop(when+.19)}
function phrase(){if(!playing||!ctx)return;const t=ctx.currentTime+.06;const beat=.29;const melody=[659,784,880,784,659,587,659,988,880,784,659,587,523,659,784,1047];const bass=[262,262,220,220,175,175,196,196];melody.forEach((f,i)=>tone(f,beat*.72,t+i*beat,.025,'triangle'));bass.forEach((f,i)=>tone(f,beat*1.75,t+i*beat*2,.012,'sine'));for(let i=0;i<16;i++){percussion(t+i*beat,'hat');if(i%4===0)percussion(t+i*beat,'kick');if(i%4===2)percussion(t+i*beat,'snare')}}
document.getElementById('music').onclick=async()=>{if(!playing){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();playing=true;phrase();musicTimer=setInterval(phrase,4640)}else{playing=false;clearInterval(musicTimer)}document.getElementById('music').textContent=playing?'♫ Muzik: Hidup':'♫ Muzik: Mati'};
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('show');if(!modal.classList.contains('show')&&e.key==='ArrowRight')next();if(!modal.classList.contains('show')&&e.key==='ArrowLeft')go(slide-1)});go(23);
</script></body></html>
