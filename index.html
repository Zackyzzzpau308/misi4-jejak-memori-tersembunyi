<!doctype html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misi Detektif — Fasa Penutup</title><style>
*{box-sizing:border-box}body{margin:0;background:#101728;color:white;font-family:system-ui,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}.app{width:min(100vw,1600px);position:relative}.stage{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;background:#201b27;border-radius:14px;box-shadow:0 12px 45px #0008}.stage img{width:100%;height:100%;object-fit:fill;display:block;animation:sceneIn .75s ease-out both,sceneFloat 10s ease-in-out 1s infinite alternate}@keyframes sceneIn{from{opacity:0;filter:brightness(.6);transform:scale(1.04)}to{opacity:1;filter:brightness(1);transform:scale(1)}}@keyframes sceneFloat{to{transform:scale(1.012)}}.hit{position:absolute;cursor:pointer;border:0;background:transparent;border-radius:30px;z-index:7;touch-action:manipulation}.hit:hover{box-shadow:inset 0 0 0 3px #ffdd6688}.hit:focus-visible{outline:4px solid white}.hit:focus-visible{outline:4px solid #fff;outline-offset:-5px;background:#fff2}.nav{display:none}.nav button,.ctl button,.action{background:linear-gradient(#238b66,#05623d);border:2px solid #e5b84e;color:white;border-radius:30px;font-weight:800;padding:10px 16px;cursor:pointer;text-shadow:0 2px #143}.ctl{position:absolute;right:1%;top:1%;display:flex;gap:7px;z-index:6}.ctl button{padding:8px 12px;background:#40301e}.count{display:none;position:absolute;top:1.5%;left:1%;background:#0009;padding:7px 12px;border-radius:16px;font-size:12px;z-index:5}.fx{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}.spark{position:absolute;font-size:clamp(13px,2.2vw,30px);animation:spark 2.4s ease-in-out infinite;opacity:0}@keyframes spark{0%,100%{opacity:0;transform:translateY(9px) scale(.6)}45%{opacity:.85;transform:translateY(-8px) scale(1.1)}}@media(prefers-reduced-motion:reduce){.stage img,.spark{animation:none!important}}.modal{position:absolute;inset:0;background:#061224d9;display:none;align-items:center;justify-content:center;padding:3%;z-index:8}.modal.show{display:flex}.panel{background:#fff6df;color:#202338;border:6px solid #ad7731;border-radius:22px;max-height:100%;overflow:auto;padding:clamp(12px,2.5vw,32px);width:min(95%,780px);text-align:center;box-shadow:0 12px 35px #0009}.panel h2{margin:0 0 8px;font-size:clamp(20px,3vw,35px)}.panel p{font-size:clamp(14px,1.6vw,21px)}.questions{display:grid;gap:12px;text-align:left}.question{border:2px solid #c4a56b;padding:12px;border-radius:12px}.question p{margin:0 0 9px;font-weight:700}.choices{display:flex;gap:7px;flex-wrap:wrap}.choices button{font-size:clamp(12px,1.4vw,17px);background:white;border:2px solid #c2a66d;border-radius:10px;padding:8px;cursor:pointer}.choices button.selected{background:#d8f4df;border-color:#13824b;box-shadow:inset 0 0 0 1px #13824b}.actions{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.action.secondary{background:#735637}.certificate{border:7px double #c79a39;padding:20px;background:#fffdf6}.certificate input{width:min(100%,350px);font-size:22px;text-align:center;border:0;border-bottom:2px solid #a88441;background:transparent;padding:10px}.hint{font-size:12px;color:#5a5144}.screen-reader{position:absolute;left:-9999px}@media(max-width:700px){.nav button,.ctl button{font-size:11px;padding:6px 9px}.count{display:none}.panel{border-width:3px}.stage{border-radius:0}}@media print{body{background:white}.app,.stage,.modal{position:static;display:block!important;box-shadow:none}.stage img,.hit,.nav,.ctl,.count,.actions,.hint{display:none!important}.modal{background:white;padding:0}.panel{border:0;max-height:none}.certificate{min-height:85vh;padding:7vh 5vw}.certificate input{font-size:32px}}
</style></head><body><main class="app"><div class="stage" id="stage"><img id="bg" src="slaid_23.webp" alt="Babak permainan detektif"><div class="count" id="count">Fasa Penutup • 23 / 31</div><div class="ctl"><button id="music" title="Hidup atau matikan muzik">♫ Muzik: Mati</button><button id="voice" title="Bacakan arahan">🔊 Baca</button></div><button class="hit" id="hotspot" aria-label="Teruskan ke babak seterusnya"></button><div class="fx" id="fx" aria-hidden="true"></div><button class="hit" id="restart" aria-label="Main semula" style="display:none"></button><section class="modal" id="modal" aria-live="polite"><div class="panel" id="panel"></div></section></div></main><script>
const slides={23:{title:'Jejak Memori Tersembunyi',say:'Wah! Sebuah komputer riba misteri. Dekati komputer untuk mengetahui rahsia terakhir.',hit:[.68,.80,.31,.18]},24:{title:'Mesej Rahsia Profesor',say:'Tahniah, Detektif Cilik! Kamu telah mengumpulkan tiga bukti penyiasatan. Buka fail rahsia.',hit:[.65,.79,.34,.20]},25:{title:'Fail Misteri Ditemukan',say:'Fail misteri telah ditemukan. Bongkar rahsia untuk mengetahui perkara sebenar.',hit:[.65,.80,.34,.19]},26:{title:'Rahsia di Sebalik Pintu',say:'Tahniah! Profesor Bahasa mendedahkan bahawa penyiasatan ini ialah ujian untuk mencari Detektif Bahasa yang hebat.',hit:[.71,.81,.28,.17]},27:{title:'Misi Berjaya',say:'Syabas! Kamu telah berjaya menyelesaikan tiga misi penyiasatan. Lihat bukti yang kamu kumpulkan.',hit:[.64,.80,.34,.19]},28:{title:'Koleksi Bukti Detektif',say:'Lihat tiga lencana kamu. Kamu telah membaca, mencari makna dan menyelesaikan cabaran bahasa.',hit:[.67,.81,.32,.18]},29:{title:'Refleksi Detektif Cilik',say:'Sekarang, pilih jawapan bagi tiga soalan refleksi. Tekan butang Selesai apabila sudah siap.',hit:[.69,.80,.30,.19]},30:{title:'Anugerah Detektif Bahasa',say:'Tahniah! Kamu layak menerima Sijil Detektif Bahasa. Isikan nama untuk melihat dan mencetak sijil.',hit:[.69,.80,.30,.19]},31:{title:'Tamat Penyiasatan',say:'Tahniah! Semua misi selesai. Teruskan membaca dan meneroka perkataan baharu.',hit:[.68,.81,.30,.18]}};
let slide=23, ctx=null, musicTimer=null, playing=false, audioOn=false;const bg=document.getElementById('bg'),spot=document.getElementById('hotspot'),modal=document.getElementById('modal'),panel=document.getElementById('panel');
function go(n){slide=Math.max(23,Math.min(31,n));bg.src='slaid_'+slide+'.webp';bg.alt=slides[slide].title;document.getElementById('count').textContent='Fasa Penutup • '+slide+' / 31';let h=slides[slide].hit;Object.assign(spot.style,{left:(h[0]*100)+'%',top:(h[1]*100)+'%',width:(h[2]*100)+'%',height:(h[3]*100)+'%'});spot.setAttribute('aria-label',slide===31?'Main semula':slide===29?'Buka refleksi':slide===30?'Buka sijil':'Ke babak seterusnya');modal.classList.remove('show');renderEffects();const restart=document.getElementById('restart');restart.style.display=slide===31?'block':'none';Object.assign(restart.style,{left:'36%',top:'83%',width:'27%',height:'15%'});if(slide===31){Object.assign(spot.style,{left:'68%',top:'83%',width:'30%',height:'15%'});}}
function renderEffects(){const fx=document.getElementById('fx');fx.innerHTML='';if([24,25,27,28,30,31].includes(slide)){[[58,36],[75,41],[62,65],[90,58],[42,21]].forEach(([x,y],i)=>{const e=document.createElement('span');e.className='spark';e.textContent='✦';e.style.left=x+'%';e.style.top=y+'%';e.style.animationDelay=i*.38+'s';fx.appendChild(e)})}}
function next(){if(slide===29){reflection();return}if(slide===30){certificate();return}if(slide===31){go(23);return}go(slide+1)}spot.onclick=next;document.getElementById('restart').onclick=()=>go(23);
function speak(s){if(!('speechSynthesis' in window)){alert('Fungsi bacaan suara tidak disokong oleh pelayar ini.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='ms-MY';u.rate=.86;u.pitch=1.08;speechSynthesis.speak(u)}document.getElementById('voice').onclick=()=>speak(slides[slide].say);
function openPanel(html){panel.innerHTML=html;modal.classList.add('show')}
let answers={};const qs=[{q:'Adakah kamu seronok membaca cerita misteri?',a:['😊 Ya','😐 Biasa','🙁 Tidak']},{q:'Adakah kamu berjaya mencari makna perkataan menggunakan kamus digital?',a:['😊 Ya','😐 Dengan bantuan','🙁 Belum']},{q:'Adakah kamu mahu menyertai misi detektif yang lain?',a:['😊 Ya','😐 Mungkin','🙁 Tidak']}];
function reflection(){openPanel('<h2>🔎 Refleksi Detektif Cilik</h2><p>Pilih satu jawapan bagi setiap soalan.</p><div class="questions">'+qs.map((q,i)=>'<div class="question"><p>'+(i+1)+'. '+q.q+'</p><div class="choices">'+q.a.map((a,j)=>'<button type="button" data-i="'+i+'" data-j="'+j+'" class="'+(answers[i]===j?'selected':'')+'">'+a+'</button>').join('')+'</div></div>').join('')+'</div><div class="actions"><button class="action secondary" id="close">Kembali</button><button class="action" id="finish">SELESAI →</button></div>');panel.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{answers[+b.dataset.i]=+b.dataset.j;panel.querySelectorAll('[data-i="'+b.dataset.i+'"]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('close').onclick=()=>modal.classList.remove('show');document.getElementById('finish').onclick=()=>{if(Object.keys(answers).length<3){alert('Sila pilih jawapan bagi ketiga-tiga soalan.');return}go(30)}}
function certificate(){openPanel('<div class="certificate"><h2>🏅 SIJIL DETEKTIF BAHASA</h2><p>Dengan bangganya dianugerahkan kepada</p><input id="student" maxlength="65" placeholder="Nama murid" aria-label="Nama murid"><p>atas kejayaan menyelesaikan</p><h2>Misi Detektif: Rahsia di Sebalik Pintu!</h2><p><strong>GELARAN: DETEKTIF BAHASA CEMERLANG</strong></p><p>⭐ ⭐ ⭐</p></div><div class="actions"><button class="action secondary" id="close">Kembali</button><button class="action" id="print">Cetak Sijil</button><button class="action" id="continue">TERUSKAN →</button></div><p class="hint">Isikan nama murid sebelum mencetak.</p>');document.getElementById('close').onclick=()=>modal.classList.remove('show');document.getElementById('print').onclick=()=>window.print();document.getElementById('continue').onclick=()=>go(31)}
function note(freq,duration,when,gain=.045){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(gain,when+.025);g.gain.exponentialRampToValueAtTime(.001,when+duration);o.connect(g).connect(ctx.destination);o.start(when);o.stop(when+duration+.02)}
function phrase(){if(!playing||!ctx)return;let t=ctx.currentTime+.05,notes=[392,494,587,494,440,523,659,523,392,494,587,784,659,587,494,392];notes.forEach((f,i)=>note(f,.22,t+i*.24,.025));note(196,1.6,t,.012);note(220,1.6,t+1.92,.012)}document.getElementById('music').onclick=async()=>{if(!playing){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();playing=true;phrase();musicTimer=setInterval(phrase,3840)}else{playing=false;clearInterval(musicTimer)}document.getElementById('music').textContent=playing?'♫ Muzik: Hidup':'♫ Muzik: Mati'};
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('show');if(!modal.classList.contains('show')&&e.key==='ArrowRight')next();if(!modal.classList.contains('show')&&e.key==='ArrowLeft')go(slide-1)});go(23);
</script></body></html>
